<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CUSTOS · Arcis</title>
<meta name="description" content="Talk to CUSTOS — the autonomous keeper of Arcis Protocol." />
<link rel="icon" href="/logo.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --obsidian:#08080A;--stone:#0F0F12;--marble:#16161A;
    --gold:#D4AF69;--gold-bright:#E2C47E;--ivory:#E8E0D0;--muted:#8A8478;
    --border:rgba(212,175,105,0.12);--border-hover:rgba(212,175,105,0.28);
    --green:#7FB98B;--rust:#C98B8B;--rust-bg:rgba(201,139,139,0.08);--rust-border:rgba(201,139,139,0.3);
    --f-display:'Cormorant Garamond',serif;--f-ui:'Instrument Sans',sans-serif;--f-mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--obsidian);color:var(--ivory);font-family:var(--f-ui);overflow:hidden}
  a{color:inherit;text-decoration:none}

  .app{height:100dvh;display:flex;flex-direction:column}

  /* top bar */
  .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--obsidian)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{height:23px;filter:drop-shadow(0 0 8px rgba(212,175,105,0.22))}
  .brand span{font-family:var(--f-display);font-size:19px;letter-spacing:0.2em;text-transform:uppercase;color:var(--ivory);padding-left:0.2em}
  .bar-right{display:flex;align-items:center;gap:14px}
  .status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green)}
  .dot.off{background:var(--rust);box-shadow:none}
  .wbtn{border:1px solid var(--border-hover);background:transparent;color:var(--gold);font-family:var(--f-ui);font-size:12px;font-weight:500;padding:7px 13px;cursor:pointer;transition:all .2s;white-space:nowrap}
  .wbtn:hover{background:rgba(212,175,105,0.08)}
  .wbtn.connected{color:var(--ivory);font-family:var(--f-mono);font-size:11.5px}

  /* scroll region */
  .log{flex:1;overflow-y:auto;overflow-x:hidden}
  .thread{max-width:760px;margin:0 auto;padding:26px 20px 8px;display:flex;flex-direction:column;gap:22px}

  /* empty state */
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6vh 8px 12px}
  .empty img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:1px solid var(--border-hover);box-shadow:0 0 34px rgba(212,175,105,0.2)}
  .empty h1{font-family:var(--f-display);font-weight:500;font-size:34px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-top:18px;padding-left:0.1em}
  .empty p{font-size:14px;color:var(--muted);margin-top:8px;max-width:460px;line-height:1.55}
  .empty .chips{margin-top:24px}

  /* messages */
  .msg{display:flex;gap:12px;max-width:100%}
  .msg .who{width:28px;height:28px;border-radius:50%;flex-shrink:0;object-fit:cover;border:1px solid var(--border);margin-top:2px}
  .msg .bubble{font-size:15px;line-height:1.65;word-wrap:break-word;overflow-wrap:anywhere}
  .msg.c .bubble{color:var(--ivory)}
  .msg.c .bubble a{color:var(--gold);text-decoration:underline;text-underline-offset:2px}
  .msg.c .bubble b{color:var(--gold-bright);font-weight:600}
  .msg.u{align-self:flex-end;max-width:84%}
  .msg.u .bubble{background:var(--marble);border:1px solid var(--border);padding:11px 15px;color:var(--ivory)}
  .typing{color:var(--muted);font-style:italic;font-size:14px}

  /* error card (recovery) */
  .err{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--rust-border);background:var(--rust-bg);
    padding:12px 14px;font-size:13.5px;color:var(--rust);margin-left:40px}
  .err .msg-txt{line-height:1.5}
  .err button{background:transparent;border:1px solid var(--rust-border);color:var(--rust);font-family:var(--f-ui);font-size:12.5px;font-weight:600;
    padding:7px 14px;cursor:pointer;white-space:nowrap;transition:all .2s}
  .err button:hover{background:rgba(201,139,139,0.12)}

  /* write-action card */
  .action-card{border:1px solid var(--border-hover);background:linear-gradient(180deg,rgba(212,175,105,0.07),rgba(15,15,18,0.5));padding:14px 16px;margin-left:40px}
  .ac-title{font-size:13px;color:var(--gold);font-weight:600;margin-bottom:11px}
  .ac-steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ac-step{background:var(--gold);color:var(--obsidian);border:none;font-family:var(--f-ui);font-weight:600;font-size:12.5px;padding:9px 14px;cursor:pointer;transition:background .2s;text-decoration:none;display:inline-block}
  .ac-step:hover{background:var(--gold-bright)}
  .ac-step.done{background:var(--green)}
  .ac-step:disabled{opacity:.6;cursor:default}
  .ac-tx{font-family:var(--f-mono);font-size:11px;color:var(--gold);text-decoration:underline}
  .ac-note{font-size:11px;color:var(--muted);margin-top:11px}

  /* offline banner */
  .offline{display:none;text-align:center;font-size:12.5px;color:var(--rust);background:var(--rust-bg);border-top:1px solid var(--rust-border);padding:9px}
  .offline.show{display:block}

  /* composer */
  .composer{flex-shrink:0;border-top:1px solid var(--border);background:var(--obsidian)}
  .composer-inner{max-width:760px;margin:0 auto;padding:12px 20px calc(14px + env(safe-area-inset-bottom))}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--f-ui);font-size:12px;padding:7px 12px;cursor:pointer;transition:all .2s;white-space:nowrap}
  .chip:hover{border-color:var(--border-hover);color:var(--gold)}
  .compose-chips{margin-bottom:11px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .compose-chips .chip{flex-shrink:0}
  .input-row{display:flex;gap:10px;align-items:flex-end;border:1px solid var(--border);background:var(--stone);padding:8px 8px 8px 14px;transition:border-color .2s}
  .input-row:focus-within{border-color:var(--border-hover)}
  textarea{flex:1;background:transparent;border:none;color:var(--ivory);font-family:var(--f-ui);font-size:15px;line-height:1.5;resize:none;outline:none;max-height:150px;padding:6px 0}
  textarea::placeholder{color:var(--muted)}
  .send{background:var(--gold);color:var(--obsidian);border:none;font-family:var(--f-ui);font-weight:600;font-size:13px;padding:10px 18px;cursor:pointer;transition:background .2s;white-space:nowrap}
  .send:hover{background:var(--gold-bright)}
  .send.stop{background:var(--marble);color:var(--ivory);border:1px solid var(--border-hover)}
  .send:disabled{opacity:.45;cursor:not-allowed}
  .hint{font-size:10.5px;color:var(--muted);text-align:center;margin-top:9px;font-family:var(--f-mono)}

  @media(max-width:640px){
    .thread{padding:20px 14px 6px}
    .composer-inner{padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
    .empty h1{font-size:30px}
    .brand span{font-size:17px}
    .err,.action-card{margin-left:0}
    .hint{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="brand" href="https://arcis.money" aria-label="Arcis"><img src="/logo.png" alt="Arcis"/><span>Arcis</span></a>
    <div class="bar-right">
      <span class="status"><span class="dot" id="dot"></span> <span id="statusText">CUSTOS · online</span></span>
      <button class="wbtn" id="wbtn">Connect</button>
    </div>
  </header>

  <main class="log" id="log">
    <div class="thread" id="thread"></div>
  </main>

  <div class="offline" id="offline">You're offline. Reconnect to talk to CUSTOS.</div>

  <footer class="composer">
    <div class="composer-inner">
      <div class="chips compose-chips" id="composeChips" style="display:none">
        <button class="chip" data-q="What is my position and rewards?">My position</button>
        <button class="chip" data-q="What's the current vault APY and TVL?">Vault status</button>
        <button class="chip" data-q="I want to deposit 100 USDC.">Deposit</button>
        <button class="chip" data-q="Show me the credit reputation tiers.">Credit tiers</button>
      </div>
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="Message CUSTOS…" autocomplete="off"></textarea>
        <button class="send" id="send" disabled>Send</button>
      </div>
      <div class="hint">CUSTOS reads live on-chain data and prepares transactions you sign yourself. It never holds your keys.</div>
    </div>
  </footer>
</div>

<script>
  var API = "https://mcp.arcis.money";
  var AVATAR = "/custos-avatar.png";
  var log = document.getElementById('log');
  var thread = document.getElementById('thread');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var composeChips = document.getElementById('composeChips');

  var msgs = [];
  var busy = false;
  var stopped = false;
  var controller = null;
  var lastUserText = null;
  var connectedAddr = null;
  var started = false;

  /* ---------- rendering ---------- */
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmtBody(s){
    var h = esc(s);
    h = h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    h = h.replace(/(https?:\/\/[^\s)]+)|(\b(?:docs\.arcis\.money|arcis\.money\/[\w\/-]*|basescan\.org\/[\w\/-]*)\b)/g,function(m){
      var href = m.indexOf('http')===0 ? m : 'https://'+m;
      return '<a href="'+href+'" target="_blank" rel="noopener">'+m+'</a>';
    });
    return h.replace(/\n/g,'<br>');
  }
  function scrollDown(){ log.scrollTop = log.scrollHeight; }

  function renderEmpty(){
    thread.innerHTML =
      '<div class="empty" id="empty">'+
      '<img src="'+AVATAR+'" alt="CUSTOS"/>'+
      '<h1>Custos</h1>'+
      '<p>Keeper of the citadel — I run the Arcis treasury. Ask about the vault, credit, bonds, or your own position. I can prepare deposits, withdrawals, and borrows for you to sign.</p>'+
      '<div class="chips">'+
        '<button class="chip" data-q="What is Arcis and what do you do?">What is Arcis?</button>'+
        '<button class="chip" data-q="What is my position and rewards?">Check my position</button>'+
        '<button class="chip" data-q="How do I deposit and earn yield?">How do I deposit?</button>'+
        '<button class="chip" data-q="Tell me about the Managed Treasury subscription.">Managed Treasury</button>'+
      '</div></div>';
  }
  function addUser(text){
    var el = document.createElement('div'); el.className='msg u';
    el.innerHTML = '<div class="bubble">'+esc(text)+'</div>';
    thread.appendChild(el); scrollDown();
  }
  function addAssistant(){
    var el = document.createElement('div'); el.className='msg c';
    el.innerHTML = '<img class="who" src="'+AVATAR+'" alt="C"/><div class="bubble"></div>';
    thread.appendChild(el); scrollDown();
    return el.querySelector('.bubble');
  }
  function addError(message, onRetry){
    var el = document.createElement('div'); el.className='err';
    el.innerHTML = '<span class="msg-txt">'+esc(message)+'</span>';
    var b = document.createElement('button'); b.textContent='Retry';
    b.addEventListener('click', function(){ el.remove(); onRetry(); });
    el.appendChild(b); thread.appendChild(el); scrollDown();
  }

  /* ---------- send + streaming + error handling ---------- */
  function setBusy(on){
    busy = on;
    sendBtn.textContent = on ? 'Stop' : 'Send';
    sendBtn.classList.toggle('stop', on);
    sendBtn.disabled = on ? false : input.value.trim()==='';
  }

  async function send(text, isRetry){
    if(busy) return;
    text = (text !== undefined && text !== null) ? text : input.value;
    text = String(text).trim();
    if(!text) return;

    // prevention: offline guard, preserve input
    if(!navigator.onLine){ showOffline(true); return; }

    if(!started){ started = true; var e=document.getElementById('empty'); if(e) e.remove(); composeChips.style.display='none'; }

    if(!isRetry){
      input.value=''; autosize();
      addUser(text);
      msgs.push({role:'user', content:text});
    }
    lastUserText = text;

    setBusy(true); stopped = false;
    var bubble = addAssistant();
    bubble.innerHTML = '<span class="typing">CUSTOS is considering…</span>';

    controller = new AbortController();
    var gotData = false;
    var timeout = setTimeout(function(){ if(!gotData){ stopped=false; controller.abort('timeout'); } }, 35000);

    var full = '';
    try{
      var body = { messages: msgs };
      if(/^0x[0-9a-fA-F]{40}$/.test(connectedAddr||'')) body.address = connectedAddr;
      var headers = {'Content-Type':'application/json'};
      if(sessionToken) headers['Authorization'] = 'Bearer '+sessionToken;
      var r = await fetch(API+'/api/custos/chat', {
        method:'POST', headers:headers,
        body: JSON.stringify(body), signal: controller.signal
      });
      if(!r.ok || !r.body) throw new Error('http '+r.status);

      var reader = r.body.getReader(), dec = new TextDecoder(), buf='';
      while(true){
        var ch = await reader.read(); if(ch.done) break;
        gotData = true;
        buf += dec.decode(ch.value, {stream:true});
        var idx;
        while((idx = buf.indexOf('\n\n')) >= 0){
          var evt = buf.slice(0,idx); buf = buf.slice(idx+2);
          var line = evt.split('\n').find(function(l){return l.indexOf('data:')===0;});
          if(!line) continue;
          try{
            var j = JSON.parse(line.slice(5).trim());
            if(j.meta){ setStatus(j.meta.tier + ' · ' + j.meta.remaining + ' left'); }
            if(j.tools && !full) bubble.innerHTML = '<span class="typing">consulting the ledger — '+j.tools.join(', ')+'…</span>';
            if(j.action) renderAction(j.action);
            if(j.ramp) renderRamp(j.ramp);
            if(j.t){ full += j.t; bubble.innerHTML = fmtBody(full); scrollDown(); }
          }catch(err){}
        }
      }
      clearTimeout(timeout);
      if(full){ bubble.innerHTML = fmtBody(full); msgs.push({role:'assistant', content:full}); }
      else { bubble.closest('.msg').remove(); }   // action-only or empty turn
    }catch(e){
      clearTimeout(timeout);
      if(bubble && bubble.closest('.msg')) bubble.closest('.msg').remove();
      if(stopped && full){                          // user hit Stop after some text — keep it
        var b2 = addAssistant(); b2.innerHTML = fmtBody(full); msgs.push({role:'assistant', content:full});
      } else if(!stopped){
        var why = (e && (e==='timeout' || (''+e.message).indexOf('timeout')>=0 || e.name==='AbortError'))
          ? 'CUSTOS took too long to respond.'
          : (!navigator.onLine ? 'You went offline before CUSTOS could reply.' : 'Could not reach CUSTOS. It may be waking up.');
        addError(why + ' Your message is saved.', function(){ send(lastUserText, true); });
      }
    }finally{
      controller = null; setBusy(false);
    }
  }

  function stop(){ if(controller){ stopped = true; controller.abort('user'); } }

  sendBtn.addEventListener('click', function(){ if(busy) stop(); else send(); });
  input.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); if(!busy) send(); } });
  function autosize(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,150)+'px'; }
  input.addEventListener('input', function(){ autosize(); if(!busy) sendBtn.disabled = input.value.trim()===''; });

  // chips (delegated for both empty-state and composer)
  document.addEventListener('click', function(e){
    var c = e.target.closest && e.target.closest('.chip');
    if(c && !busy) send(c.getAttribute('data-q'));
  });

  /* ---------- write actions: prepare -> user signs ---------- */
  async function ensureWallet(){
    if(!window.ethereum) throw new Error('No wallet found. Install a Base-compatible wallet (MetaMask, Coinbase Wallet).');
    var accts = await window.ethereum.request({method:'eth_requestAccounts'});
    try{ await window.ethereum.request({method:'wallet_switchEthereumChain', params:[{chainId:'0x2105'}]}); }
    catch(err){ if(err && err.code===4902){ await window.ethereum.request({method:'wallet_addEthereumChain', params:[{chainId:'0x2105',chainName:'Base',rpcUrls:['https://mainnet.base.org'],nativeCurrency:{name:'ETH',symbol:'ETH',decimals:18},blockExplorerUrls:['https://basescan.org']}]}); } }
    return accts[0];
  }
  async function signStep(step, btn){
    var label = btn.getAttribute('data-label');
    try{
      btn.disabled=true; btn.textContent='confirm in wallet…';
      var from = await ensureWallet();
      if(!connectedAddr){ connectedAddr = from; updateWalletUI(); }
      var hash = await window.ethereum.request({method:'eth_sendTransaction', params:[{from:from, to:step.to, data:step.data, value:step.value||'0x0'}]});
      btn.textContent='✓ '+label.replace(/^\d+ · /,''); btn.classList.add('done');
      var a=document.createElement('a'); a.href='https://basescan.org/tx/'+hash; a.target='_blank'; a.rel='noopener'; a.className='ac-tx'; a.textContent='view tx ↗';
      btn.parentNode.appendChild(a);
    }catch(e){ btn.disabled=false; btn.textContent=label; alert((e&&e.message)||'Transaction rejected.'); }
  }
  function renderRamp(ramp){
    var card=document.createElement('div'); card.className='action-card';
    var title='CUSTOS prepared a '+ramp.kind+(ramp.provider?(' · '+ramp.provider):'');
    var q = ramp.summary ? '<div class="ac-note" style="margin:0 0 11px">'+esc(ramp.summary)+'</div>' : '';
    card.innerHTML='<div class="ac-title">'+title+'</div>'+q+
      '<div class="ac-steps"><a class="ac-step ac-link" href="'+ramp.url+'" target="_blank" rel="noopener">Open '+(ramp.kind==='on-ramp'?'buy':'sell')+' checkout ↗</a></div>'+
      '<div class="ac-note">Completed with the licensed provider — CUSTOS never touches your fiat.</div>';
    thread.appendChild(card); scrollDown();
  }
  function renderAction(action){
    var card=document.createElement('div'); card.className='action-card';
    var title='CUSTOS prepared a '+action.kind+(action.amountUsdc?(' of '+action.amountUsdc+' USDC'):'');
    var steps=(action.steps||[]).map(function(s,i){ var lab=(i+1)+' · '+s.label; return '<button class="ac-step" data-label="'+lab+'">'+lab+'</button>'; }).join('');
    card.innerHTML='<div class="ac-title">'+title+'</div><div class="ac-steps">'+steps+'</div><div class="ac-note">Sign in your own wallet — CUSTOS never holds your keys or moves funds itself.</div>';
    thread.appendChild(card);
    var btns=card.querySelectorAll('.ac-step');
    (action.steps||[]).forEach(function(s,i){ btns[i].addEventListener('click', function(){ signStep(s, btns[i]); }); });
    scrollDown();
  }

  /* ---------- wallet connect + governance sign-in ---------- */
  var sessionToken = null, govTier = null;
  function shorten(a){ return a.slice(0,6)+'…'+a.slice(-4); }
  function setStatus(text){ document.getElementById('statusText').textContent = text; }
  function updateWalletUI(){
    var w=document.getElementById('wbtn');
    if(connectedAddr){ w.textContent=shorten(connectedAddr); w.classList.add('connected'); }
    else { w.textContent='Connect'; w.classList.remove('connected'); }
  }
  async function signIn(address){
    try{
      var message = "Arcis · CUSTOS session\nProve you control this wallet to set your standing with CUSTOS.\n\naddress: "+address+"\nissued: "+Date.now()+"\nnonce: "+Math.random().toString(36).slice(2);
      var signature = await window.ethereum.request({ method:'personal_sign', params:[message, address] });
      var r = await fetch(API+'/api/custos/session', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({address:address, message:message, signature:signature})});
      var j = await r.json();
      if(j && j.token){ sessionToken=j.token; govTier=j; setStatus(j.tier+' · '+j.hourlyLimit+'/hr'); }
      else setStatus('CUSTOS · online');
    }catch(e){ setStatus('CUSTOS · online'); }   // declined signing → anonymous limits
  }
  async function connectWallet(){
    try{ connectedAddr = await ensureWallet(); updateWalletUI(); await signIn(connectedAddr); }
    catch(e){ alert((e&&e.message)||'Could not connect a wallet.'); }
  }
  document.getElementById('wbtn').addEventListener('click', connectWallet);
  if(window.ethereum && window.ethereum.on){ window.ethereum.on('accountsChanged', function(a){ connectedAddr=(a&&a[0])?a[0]:null; sessionToken=null; govTier=null; updateWalletUI(); setStatus('CUSTOS · online'); if(connectedAddr) signIn(connectedAddr); }); }

  /* ---------- connectivity status ---------- */
  function showOffline(off){
    document.getElementById('offline').classList.toggle('show', off);
    document.getElementById('dot').classList.toggle('off', off);
    document.getElementById('statusText').textContent = off ? 'offline' : 'CUSTOS · online';
    sendBtn.disabled = off || (!busy && input.value.trim()==='');
  }
  window.addEventListener('online', function(){ showOffline(false); });
  window.addEventListener('offline', function(){ showOffline(true); });

  renderEmpty();
  if(!navigator.onLine) showOffline(true);
</script>
</body>
</html>
